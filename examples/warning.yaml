id: https://example.org/warning
name: warning
description: A schema with nothing wrong but a missing tree root.
# Intentionally omits `tree_root`, which linkml-scala reports as a warning
# (not a fatal error). Used to test warning handling and `strict`.
prefixes:
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types
classes:
  Widget:
    description: A widget.
    attributes:
      label:
        description: Text on the widget.
        range: string
