# Two related classes: Person has an identifier and can be a table with a
# primary key, Address has none. Used to exercise the frictionless generator.
id: https://example.org/tables
name: tables
title: Tables schema
description: People and their addresses, as tables.
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
default_range: string
imports:
  - linkml:types
classes:
  Person:
    tree_root: true
    description: A person, with an identifier.
    attributes:
      id:
        description: Identifier of the person.
        identifier: true
        range: string
      full_name:
        description: The person's name, in full.
        required: true
        range: string
      address:
        description: Where the person lives.
        range: Address
  Address:
    description: A postal address, with no identifier.
    attributes:
      city:
        description: Name of the city.
        range: string
