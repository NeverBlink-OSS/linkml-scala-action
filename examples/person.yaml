id: https://example.org/person
name: person
title: Person schema
description: People and how to reach them.
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
default_range: string
imports:
  - linkml:types
classes:
  Person:
    tree_root: true
    description: A person.
    attributes:
      full_name:
        description: The person's name, in full.
        required: true
        range: string
      age:
        description: Age in years.
        range: integer
      email:
        description: Email address.
        range: string
