name: "LinkML (linkml-scala)"
description: "Validate and generate from LinkML schemas in CI. Pure Node.js – no Docker, no external toolchain, no binary download."
author: "NeverBlink"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  command:
    description: "What to run: 'validate' or 'generate'."
    required: false
    default: "validate"
  files:
    description: "Schema files to process. Space- or newline-separated; globs (including **) are supported."
    required: true
  strict:
    description: "Treat warnings as failures. Errors always fail, warnings only with this on."
    required: false
    default: "false"
  generator:
    description: "generate only: json-schema | shacl | rdfs | linkml | frictionless | graphql | scala."
    required: false
    default: ""
  output:
    description: "generate only: output directory. One file per input schema is written here. If empty, output is printed to the job log."
    required: false
    default: ""
  open:
    description: "generate json-schema/shacl only: allow additional properties (open shapes)."
    required: false
    default: "false"
  format:
    description: "generate shacl/rdfs only: RDF serialization. 'ttl' for Turtle (prefixed and pretty-printed) or 'nt' for N-Triples."
    required: false
    default: "ttl"
  package:
    description: "generate scala only: target package name."
    required: false
    default: "linkml"
  pruning-mode:
    description: "generate frictionless only: which classes become tables. 'treeRoot' = only those reachable from the tree_root class, 'schema' = only those reachable from a class defined in the root schema, 'skip' = every class."
    required: false
    default: "skip"
  tree-root:
    description: "generate frictionless only: tree root class name to use instead of the schema's own tree_root. Only has an effect with pruning-mode: treeRoot."
    required: false
    default: ""
  skip-classes-without-identifier:
    description: "generate frictionless only: skip classes with no identifier slot. Such a table gets no primary key and nothing can reference it."
    required: false
    default: "false"
  imports:
    description: "Optional directory of extra .yaml schemas to make available to `imports:` (keyed by filename)."
    required: false
    default: ""
  ignore:
    description: "Newline-separated list of issue type names (a problem's `issue_type`, shown in square brackets when it is reported), e.g. NoTreeRootClass or UnknownReference. A matching problem is not annotated, not counted, and has no effect on the exit code. Still logged for auditability."
    required: false
    default: ""
  annotations:
    description: "Emit GitHub error/warning annotations for problems."
    required: false
    default: "true"
  working-directory:
    description: "Base directory for resolving `files`, `imports` and `output`."
    required: false
    default: "."

outputs:
  problems:
    description: "Total number of problems found across all schemas."
  files:
    description: "Number of schema files processed."
  linkml-version:
    description: "The bundled linkml-scala version."

runs:
  using: "node24"
  main: "dist/index.cjs"
