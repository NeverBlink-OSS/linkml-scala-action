name: "LinkML (linkml-scala)"
description: "Validate and generate from LinkML schemas in CI. Pure Node.js – no Docker, no external toolchain, no binary download."
author: "NeverBlink"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  command:
    description: "What to run: 'validate', 'generate' or 'import'."
    required: false
    default: "validate"
  files:
    description: "Files to process – LinkML schemas, or the documents to read for 'import'. Space- or newline-separated; globs (including **) are supported."
    required: true
  strict:
    description: "Treat warnings as failures. Errors always fail, warnings only with this on."
    required: false
    default: "false"
  generator:
    description: "generate only: json-schema | shacl | rdfs | owl | linkml | frictionless | graphql | typescript | pydantic | er-diagram | translation | docs | stats | ossie | scala."
    required: false
    default: ""
  importer:
    description: "import only: the format to read and turn into a LinkML schema. 'ossie' (an Apache Ossie ontology) or 'owl' (an OWL ontology or RDFS vocabulary in Turtle or N-Triples)."
    required: false
    default: ""
  output:
    description: "generate/import only: output directory. One file per input is written here. If empty, output is printed to the job log."
    required: false
    default: ""
  open:
    description: "generate json-schema/shacl/typescript/pydantic only: allow additional properties (open shapes) for every class, not only those whose extra_slots allows them."
    required: false
    default: "false"
  format:
    description: "Output serialization. For generate shacl/rdfs/owl: 'ttl' for Turtle (prefixed and pretty-printed, the default) or 'nt' for N-Triples. For generate linkml/ossie and for import: 'yaml' (the default) or 'json'. Other generators take no format."
    required: false
    default: ""
  package:
    description: "generate scala only: target package name."
    required: false
    default: "linkml"
  error-handling:
    description: "generate scala/typescript only: how the generated code reports the `errors` of the schema's functions. For scala: 'annotation' (the default) or 'either'. For typescript: 'exception' (the default) or 'result'."
    required: false
    default: ""
  generate-emit-prefixes:
    description: "generate scala only: generate a `Prefixes` object with the schema's emit_prefixes."
    required: false
    default: "true"
  skip-leaf-interfaces:
    description: "generate scala only: a concrete class that no other class extends becomes one case class, instead of an interface and an `...Impl` case class. Turn it off when other code has to extend the generated classes."
    required: false
    default: "true"
  pruning-mode:
    description: "generate linkml/frictionless/graphql/typescript/pydantic/er-diagram/docs/stats/ossie only: which elements to keep. 'tree_root' = only those reachable from the tree_root class, 'schema' = only those reachable from a class defined in the root schema, 'skip' = all of them. 'treeRoot', the spelling before v0.18.0, is still accepted. If empty, each generator uses its own default: 'schema' for graphql, er-diagram, docs and stats, 'skip' for the others."
    required: false
    default: ""
  tree-root:
    description: "generate json-schema/linkml/frictionless/graphql/typescript/pydantic/er-diagram/docs/stats/ossie only: tree root class name to use instead of the schema's own tree_root. For json-schema it sets the class at the root of the JSON Schema; for the others it only has an effect with pruning-mode: tree_root."
    required: false
    default: ""
  skip-classes-without-identifier:
    description: "generate frictionless only: skip classes with no identifier slot. Such a table gets no primary key and nothing can reference it."
    required: false
    default: "false"
  only-root-schema:
    description: "generate shacl/rdfs/owl only: describe only the classes of the root schema, not those of the schemas it imports. For owl, each imported schema gets an owl:imports instead."
    required: false
    default: "false"
  metadata-profile:
    description: "generate owl only: where descriptions go. 'rdfs' for rdfs:comment (the default) or 'linkml' for skos:definition, as in the LinkML metamodel."
    required: false
    default: ""
  permissible-values:
    description: "generate owl only: what permissible values become. 'individual' (the default) or 'class'."
    required: false
    default: ""
  skip-derivation:
    description: "generate linkml only: copy classes as they are instead of deriving them."
    required: false
    default: "false"
  include-null:
    description: "generate json-schema/typescript/pydantic only: optional values may also be null (json-schema, typescript), or dumps keep the nulls that were loaded or set (pydantic)."
    required: false
    default: "false"
  tree-root-inline-type:
    description: "generate json-schema only: how the tree root class appears at the root of the JSON Schema, instead of its tree_root_as extension. One of plain, optional, list, compact_dict, simple_dict."
    required: false
    default: ""
  indentation-step:
    description: "generate json-schema/translation only: number of spaces for each level of indentation. Defaults to 2."
    required: false
    default: ""
  optional-defaults:
    description: "generate typescript only: a slot with an `ifabsent` may be left out, for data that a program fills the defaults in. Without it, such a slot is as required as the schema says."
    required: false
    default: "false"
  metadata-language:
    description: "generate json-schema/frictionless/graphql/typescript/pydantic/docs/ossie/scala only: the language of titles and descriptions in the output, for schemas with text in more than one language. Defaults to 'en'."
    required: false
    default: ""
  full-uris:
    description: "generate linkml and import only: write URIs in full, instead of compacting them to CURIEs with the schema's prefixes."
    required: false
    default: "false"
  single-file:
    description: "generate docs only: write all pages as sections of one docs.md, instead of one file per page."
    required: false
    default: "false"
  optional-marker:
    description: "generate er-diagram only: mark optional attributes with a trailing '?' on their type. Mermaid understands this from version 11.16; older renderers throw an error, so turn it off for them."
    required: false
    default: "true"
  target:
    description: "generate translation only: the framework to translate LinkML names to. One of base (the default), uri, scala, graphql, frictionless, ossie, erdiagram, json, typescript, pydantic, docs."
    required: false
    default: ""
  derived-attributes:
    description: "generate translation only: also list inherited slots, mixin slots and slots from the class's `slots` list in classAttributes, not only the class's own attributes."
    required: false
    default: "false"
  schema-id:
    description: "import only: the `id` of the LinkML schema to produce. Defaults to a placeholder built from the source document's name (ossie) or to the ontology IRI (owl). Only valid when a single file is imported. For owl, it takes precedence over the schema_id in `config`."
    required: false
    default: ""
  config:
    description: "import owl only: path to a YAML or JSON file that changes how the ontology is mapped – names, prefixes, which annotation properties fill which metaslots, which owl:imports map to which LinkML schemas. See https://linkml.ohi.dev/docs/importers/owl/."
    required: false
    default: ""
  input-format:
    description: "import owl only: RDF syntax of the ontology. 'ttl' (Turtle, the default, which also reads N-Triples) or 'nt' (N-Triples)."
    required: false
    default: ""
  list-not-imported:
    description: "import only: report what could not be imported (property chains, individuals, unmapped owl:imports, …) as warnings, with the issue type NotImported. Like schema warnings, they fail the run only with `strict`."
    required: false
    default: "false"
  imports:
    description: "Optional directory of extra .yaml schemas. validate/generate: made available to `imports:` (keyed by path relative to working-directory). import owl: the LinkML schemas that `config` maps owl:imports to (keyed by path relative to `output`, where the schema is written)."
    required: false
    default: ""
  import-map:
    description: "validate/generate only: path to a JSON import map, in the format of linkml-scala's --import-map and LinkML-Python's --importmap, that says where to load imports from without changing the schema, e.g. {\"https://example.org/units/\": \"deps/units/\"}. Local locations are relative to working-directory and are read from disk. See https://linkml.ohi.dev/docs/import-maps/."
    required: false
    default: ""
  ignore:
    description: "Newline-separated list of issue type names (a problem's `issue_type`, shown in square brackets when it is reported), e.g. NoTreeRootClass or UnknownReference. A matching problem is not annotated, not counted, and has no effect on the exit code. Still logged for auditability."
    required: false
    default: ""
  annotations:
    description: "Emit GitHub error/warning annotations for problems."
    required: false
    default: "true"
  working-directory:
    description: "Base directory for resolving `files`, `imports`, `import-map`, `config` and `output`."
    required: false
    default: "."

outputs:
  problems:
    description: "Total number of problems found across all schemas."
  files:
    description: "Number of files processed."
  linkml-version:
    description: "The bundled linkml-scala version."

runs:
  using: "node24"
  main: "dist/index.cjs"
