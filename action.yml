name: "LinkML (linkml-scala)"
description: "Validate and generate from LinkML schemas in CI. Pure Node.js – no Docker, no external toolchain, no binary download."
author: "NeverBlink"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  command:
    description: "What to run: 'validate', 'generate' or 'import'."
    required: false
    default: "validate"
  files:
    description: "Files to process – LinkML schemas, or the documents to read for 'import'. Space- or newline-separated; globs (including **) are supported."
    required: true
  strict:
    description: "Treat warnings as failures. Errors always fail, warnings only with this on."
    required: false
    default: "false"
  generator:
    description: "generate only: json-schema | shacl | rdfs | linkml | frictionless | graphql | ossie | scala."
    required: false
    default: ""
  importer:
    description: "import only: the format to read and turn into a LinkML schema. Currently only 'ossie' (an Apache Ossie ontology)."
    required: false
    default: ""
  output:
    description: "generate/import only: output directory. One file per input is written here. If empty, output is printed to the job log."
    required: false
    default: ""
  open:
    description: "generate json-schema/shacl only: allow additional properties (open shapes)."
    required: false
    default: "false"
  format:
    description: "Output serialization. For generate shacl/rdfs: 'ttl' for Turtle (prefixed and pretty-printed, the default) or 'nt' for N-Triples. For generate ossie and for import: 'yaml' (the default) or 'json'. Other generators take no format."
    required: false
    default: ""
  package:
    description: "generate scala only: target package name."
    required: false
    default: "linkml"
  pruning-mode:
    description: "generate frictionless/ossie only: which classes become tables (frictionless) or which elements become concepts (ossie). 'treeRoot' = only those reachable from the tree_root class, 'schema' = only those reachable from a class defined in the root schema, 'skip' = all of them."
    required: false
    default: "skip"
  tree-root:
    description: "generate frictionless/ossie only: tree root class name to use instead of the schema's own tree_root. Only has an effect with pruning-mode: treeRoot."
    required: false
    default: ""
  skip-classes-without-identifier:
    description: "generate frictionless only: skip classes with no identifier slot. Such a table gets no primary key and nothing can reference it."
    required: false
    default: "false"
  schema-id:
    description: "import only: the `id` of the LinkML schema to produce. Defaults to a placeholder built from the source document's name. Only valid when a single file is imported."
    required: false
    default: ""
  imports:
    description: "validate/generate only: optional directory of extra .yaml schemas to make available to `imports:` (keyed by filename)."
    required: false
    default: ""
  ignore:
    description: "Newline-separated list of issue type names (a problem's `issue_type`, shown in square brackets when it is reported), e.g. NoTreeRootClass or UnknownReference. A matching problem is not annotated, not counted, and has no effect on the exit code. Still logged for auditability."
    required: false
    default: ""
  annotations:
    description: "Emit GitHub error/warning annotations for problems."
    required: false
    default: "true"
  working-directory:
    description: "Base directory for resolving `files`, `imports` and `output`."
    required: false
    default: "."

outputs:
  problems:
    description: "Total number of problems found across all schemas."
  files:
    description: "Number of files processed."
  linkml-version:
    description: "The bundled linkml-scala version."

runs:
  using: "node24"
  main: "dist/index.cjs"
